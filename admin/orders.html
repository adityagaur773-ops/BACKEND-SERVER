<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRA Admin | Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,440;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0d;
            color: #ffffff;
        }
        :root {
            --gold: #B08D57;
            --bg-card: #1a1a1a;
            --border-color: #2a2a2a;
        }
        .admin-layout { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar .logo { padding: 0 12px 24px; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
        .sidebar .logo h2 { font-family: 'Fraunces', serif; font-size: 24px; color: var(--gold); letter-spacing: 3px; }
        .sidebar .logo span { color: #a0a0a0; font-size: 12px; display: block; }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: #a0a0a0;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .sidebar .nav-item:hover { background: #252525; color: #ffffff; }
        .sidebar .nav-item.active { background: rgba(176, 141, 87, 0.15); color: var(--gold); }
        .sidebar .nav-item i { font-size: 20px; width: 24px; }
        .sidebar .nav-item.logout { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px; color: #ef4444; }
        .sidebar .nav-item.logout:hover { background: rgba(239, 68, 68, 0.1); }

        .main-content { margin-left: 260px; padding: 24px 32px; flex: 1; }
        
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar .page-title h1 { font-size: 24px; font-weight: 600; }
        .topbar .page-title p { color: #a0a0a0; font-size: 14px; }
        .topbar .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 6px 6px;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .topbar .admin-profile .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #0d0d0d;
        }

        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .table-container .table-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .table-container .table-header h3 { font-size: 16px; font-weight: 600; }
        .table-container .table-header .order-count {
            color: #a0a0a0;
            font-size: 13px;
        }
        .table-wrapper { overflow-x: auto; padding: 0 24px 24px; }
        table { width: 100%; border-collapse: collapse; }
        table thead th {
            text-align: left;
            padding: 12px 8px;
            color: #a0a0a0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }
        table tbody td { padding: 12px 8px; font-size: 14px; border-bottom: 1px solid rgba(42,42,42,0.5); }
        table tbody tr:hover { background: #252525; }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending { background: rgba(234, 179, 8, 0.15); color: #eab308; }
        .status-badge.delivered { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .status-badge.shipped { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; }
        .status-badge.cancelled { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .status-badge.paid { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .status-badge.created { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; }

        .loading-shimmer {
            display: inline-block;
            width: 100%;
            height: 20px;
            background: linear-gradient(90deg, #1a1a1a 25%, #252525 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .version-info {
            color: #555;
            font-size: 11px;
            text-align: center;
            padding: 16px 0 8px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
        }
    </style>
</head>
<body>

<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <h2>KAIRA</h2>
            <span>Admin Panel</span>
        </div>
        <nav>
            <a href="index.html" class="nav-item"><i class="ri-dashboard-line"></i> Dashboard</a>
            <a href="orders.html" class="nav-item active"><i class="ri-shopping-bag-line"></i> Orders</a>
            <a href="products.html" class="nav-item"><i class="ri-box-3-line"></i> Products</a>
            <a href="#" class="nav-item logout" onclick="logout()"><i class="ri-logout-box-line"></i> Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="page-title">
                <h1>📦 Orders</h1>
                <p>Manage all customer orders</p>
            </div>
            <div class="admin-profile">
                <div class="avatar" id="avatarInitial">A</div>
                <span id="adminName">Admin</span>
            </div>
        </header>

        <div class="table-container">
            <div class="table-header">
                <h3>All Orders</h3>
                <span class="order-count" id="orderCount">Loading...</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Items</th>
                            <th>Payment</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <tr>
                            <td colspan="7" style="text-align:center;padding:30px;color:#6b6b6b;">
                                <div class="loading-shimmer" style="width:60%;margin:0 auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="version-info" id="versionInfo">Loading...</div>
    </main>
</div>

<script>
    const API_URL = 'https://backend-synda.onrender.com/api';
    
    document.getElementById('versionInfo').textContent = `API: ${API_URL}`;

    function getToken() {
        return localStorage.getItem('adminToken');
    }

    function getUser() {
        try {
            return JSON.parse(localStorage.getItem('adminUser') || '{}');
        } catch {
            return {};
        }
    }

    function logout() {
        localStorage.removeItem('adminToken');
        localStorage.removeItem('adminUser');
        window.location.href = 'login.html';
    }

    function updateUserProfile() {
        const user = getUser();
        const avatarEl = document.getElementById('avatarInitial');
        const nameEl = document.getElementById('adminName');
        
        if (user.name) {
            avatarEl.textContent = user.name.charAt(0).toUpperCase();
            nameEl.textContent = user.name;
        }
    }

    async function loadOrders() {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        try {
            updateUserProfile();

            const response = await fetch(`${API_URL}/orders`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.status === 401) {
                logout();
                return;
            }

            const data = await response.json();

            if (data.success && data.orders) {
                const orders = data.orders;
                document.getElementById('orderCount').textContent = `${orders.length} orders`;

                const tbody = document.getElementById('ordersTable');
                if (orders.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align:center;padding:30px;color:#6b6b6b;">
                                <i class="ri-shopping-bag-line" style="font-size:32px;display:block;margin-bottom:8px;"></i>
                                No orders found
                            </td>
                        </tr>
                    `;
                } else {
                    tbody.innerHTML = orders.map(o => {
                        const status = o.status || 'pending';
                        const statusMap = {
                            'paid': 'delivered',
                            'created': 'shipped',
                            'pending': 'pending',
                            'cancelled': 'cancelled'
                        };
                        const statusClass = statusMap[status] || 'pending';
                        
                        return `
                            <tr>
                                <td><code style="background:#0d0d0d;padding:2px 8px;border-radius:4px;font-size:12px;">${o.orderId ? o.orderId.slice(0, 12) : 'N/A'}</code></td>
                                <td>${o.shippingAddress?.name || 'Guest'}</td>
                                <td><strong>₹${(o.amount || o.total || 0).toLocaleString()}</strong></td>
                                <td><span class="status-badge ${statusClass}">${status}</span></td>
                                <td>${o.items?.length || 0}</td>
                                <td>${o.paymentMethod || 'N/A'}</td>
                                <td>${o.createdAt ? new Date(o.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : 'N/A'}</td>
                            </tr>
                        `;
                    }).join('');
                }
            }
        } catch (error) {
            console.error('Error loading orders:', error);
            document.getElementById('ordersTable').innerHTML = `
                <tr>
                    <td colspan="7" style="text-align:center;padding:30px;color:#ef4444;">
                        <i class="ri-error-warning-line" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                        ${error.message || 'Failed to load orders'}
                    </td>
                </tr>
            `;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadOrders();
        setInterval(() => {
            if (getToken()) {
                loadOrders();
            }
        }, 30000);
    });
</script>
</body>
</html>
