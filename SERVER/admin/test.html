<!DOCTYPE html>
<html>
<head>
    <title>KAIRA - API Test</title>
    <style>
        body { font-family: Arial; background: #0d0d0d; color: white; padding: 40px; }
        button { 
            padding: 12px 24px; 
            background: #B08D57; 
            border: none; 
            border-radius: 8px; 
            color: #0d0d0d; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            margin: 5px;
        }
        button:hover { background: #c9a56e; }
        pre { 
            background: #1a1a1a; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #2a2a2a; 
            margin-top: 20px; 
            white-space: pre-wrap;
            max-height: 400px;
            overflow: auto;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        .status-bar {
            padding: 10px 16px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
        }
        .status-bar.running { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
        .status-bar.stopped { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .status-bar.checking { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }
    </style>
</head>
<body>
    <h1>🔧 KAIRA API Test</h1>
    
    <div id="statusBar" class="status-bar checking">⏳ Checking backend status...</div>

    <div style="margin: 20px 0;">
        <button onclick="doTestHealth()">1️⃣ Test Health</button>
        <button onclick="doTestLogin()">2️⃣ Test Login</button>
        <button onclick="doTestDashboard()">3️⃣ Test Dashboard</button>
        <button onclick="doClear()">🗑️ Clear</button>
        <button onclick="doTestAll()">🔄 Test All</button>
    </div>

    <div id="result">
        <p class="info">Click a button to test...</p>
    </div>

    <script>
        // ============================================
        // COMPLETE WORKING TEST - NO SCOPE ISSUES
        // ============================================
        
        console.log('🚀 Test page loaded');
        console.log('📍 Host:', window.location.hostname);

        const API_URL = 'http://localhost:5000/api';

        // ==========================
        // SHOW RESULT
        // ==========================
        function showResult(data, type) {
            var el = document.getElementById('result');
            var color = type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : '#3b82f6';
            var text = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
            el.innerHTML = '<pre style="color: ' + color + '">' + text + '</pre>';
        }

        function getToken() {
            return localStorage.getItem('adminToken');
        }

        function updateStatus(isRunning) {
            var bar = document.getElementById('statusBar');
            if (isRunning === true) {
                bar.className = 'status-bar running';
                bar.textContent = '✅ Backend is running on http://localhost:5000';
            } else if (isRunning === false) {
                bar.className = 'status-bar stopped';
                bar.textContent = '❌ Backend is NOT running. Start with: npm start';
            } else {
                bar.className = 'status-bar checking';
                bar.textContent = '⏳ Checking backend status...';
            }
        }

        // ==========================
        // TEST 1: HEALTH
        // ==========================
        function doTestHealth() {
            showResult('⏳ Testing health endpoint...', 'info');
            console.log('🔄 Testing health...');
            
            fetch('http://localhost:5000/health')
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    showResult(data, 'success');
                    console.log('✅ Health:', data);
                    updateStatus(true);
                })
                .catch(function(error) {
                    showResult('❌ Error: ' + error.message + '\n\nMake sure backend is running on http://localhost:5000\n\nRun: cd "E:\\Kaira website\\Server" && npm start', 'error');
                    console.error('❌ Health error:', error);
                    updateStatus(false);
                });
        }

        // ==========================
        // TEST 2: LOGIN
        // ==========================
        function doTestLogin() {
            showResult('⏳ Testing login...', 'info');
            console.log('🔄 Testing login...');

            var requestBody = {
                email: 'admin@kaira.com',
                password: 'Admin@123'
            };
            console.log('📤 Sending:', requestBody);

            fetch(API_URL + '/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            })
            .then(function(response) {
                console.log('📥 Status:', response.status);
                return response.json();
            })
            .then(function(data) {
                console.log('📦 Response:', data);
                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));
                    showResult({
                        success: true,
                        message: '✅ Login successful!',
                        token: data.token.substring(0, 50) + '...',
                        user: data.user
                    }, 'success');
                } else {
                    showResult(data, 'error');
                }
            })
            .catch(function(error) {
                showResult('❌ Error: ' + error.message, 'error');
                console.error('❌ Login error:', error);
            });
        }

        // ==========================
        // TEST 3: DASHBOARD
        // ==========================
        function doTestDashboard() {
            var token = getToken();
            if (!token) {
                showResult('❌ No token found. Please login first!', 'error');
                return;
            }
            showResult('⏳ Testing dashboard with token...', 'info');
            console.log('🔄 Testing dashboard...');

            fetch(API_URL + '/analytics/dashboard', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                showResult(data, 'success');
                console.log('✅ Dashboard:', data);
            })
            .catch(function(error) {
                showResult('❌ Error: ' + error.message, 'error');
                console.error('❌ Dashboard error:', error);
            });
        }

        // ==========================
        // TEST ALL
        // ==========================
        function doTestAll() {
            showResult('⏳ Running all tests...', 'info');
            doTestHealth();
            setTimeout(doTestLogin, 1500);
            setTimeout(doTestDashboard, 3000);
        }

        // ==========================
        // CLEAR
        // ==========================
        function doClear() {
            document.getElementById('result').innerHTML = '<p class="info">Click a button to test...</p>';
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            console.log('🗑️ Cleared all data');
            updateStatus(null);
        }

        // ==========================
        // AUTO-TEST ON LOAD
        // ==========================
        setTimeout(function() {
            console.log('🔄 Auto-testing health...');
            fetch('http://localhost:5000/health')
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    console.log('✅ Backend running:', d);
                    updateStatus(true);
                })
                .catch(function() {
                    console.warn('⚠️ Backend not running');
                    updateStatus(false);
                });
        }, 500);

        console.log('✅ Test page ready!');
        console.log('📍 API URL:', API_URL);
        console.log('📌 Click buttons to test!');
    </script>
</body>
</html>
