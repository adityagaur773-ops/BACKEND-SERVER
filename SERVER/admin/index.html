<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIRA Admin | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,440;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0d;
            color: #ffffff;
        }
        :root {
            --gold: #B08D57;
            --bg-card: #1a1a1a;
            --border-color: #2a2a2a;
        }
        .admin-layout { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar .logo { padding: 0 12px 24px; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
        .sidebar .logo h2 { font-family: 'Fraunces', serif; font-size: 24px; color: var(--gold); letter-spacing: 3px; }
        .sidebar .logo span { color: #a0a0a0; font-size: 12px; display: block; }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: #a0a0a0;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .sidebar .nav-item:hover { background: #252525; color: #ffffff; }
        .sidebar .nav-item.active { background: rgba(176, 141, 87, 0.15); color: var(--gold); }
        .sidebar .nav-item i { font-size: 20px; width: 24px; }
        .sidebar .nav-item.logout { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px; color: #ef4444; }
        .sidebar .nav-item.logout:hover { background: rgba(239, 68, 68, 0.1); }

        .main-content { margin-left: 260px; padding: 24px 32px; flex: 1; }
        
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar .page-title h1 { font-size: 24px; font-weight: 600; }
        .topbar .page-title p { color: #a0a0a0; font-size: 14px; }
        .topbar .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 6px 6px;
            background: var(--bg-card);
            border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .topbar .admin-profile .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #0d0d0d;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 24px;
        }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
        .stat-card .stat-label { color: #a0a0a0; font-size: 14px; }
        .stat-card .stat-icon { font-size: 24px; margin-bottom: 8px; color: var(--gold); }

        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .table-container .table-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-container .table-header h3 { font-size: 16px; font-weight: 600; }
        .table-wrapper { overflow-x: auto; padding: 0 24px 24px; }
        table { width: 100%; border-collapse: collapse; }
        table thead th {
            text-align: left;
            padding: 12px 8px;
            color: #a0a0a0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }
        table tbody td { padding: 12px 8px; font-size: 14px; border-bottom: 1px solid rgba(42,42,42,0.5); }
        table tbody tr:hover { background: #252525; }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending { background: rgba(234, 179, 8, 0.15); color: #eab308; }
        .status-badge.delivered { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .status-badge.shipped { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; }
        .status-badge.cancelled { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .status-badge.paid { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .status-badge.created { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; }

        .loading-shimmer {
            display: inline-block;
            width: 100%;
            height: 20px;
            background: linear-gradient(90deg, #1a1a1a 25%, #252525 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .version-info {
            color: #555;
            font-size: 11px;
            text-align: center;
            padding: 16px 0 8px;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <h2>KAIRA</h2>
            <span>Admin Panel</span>
        </div>
        <nav>
            <a href="index.html" class="nav-item active"><i class="ri-dashboard-line"></i> Dashboard</a>
            <a href="orders.html" class="nav-item"><i class="ri-shopping-bag-line"></i> Orders</a>
            <a href="products.html" class="nav-item"><i class="ri-box-3-line"></i> Products</a>
            <a href="#" class="nav-item logout" onclick="logout()"><i class="ri-logout-box-line"></i> Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="page-title">
                <h1>Dashboard</h1>
                <p id="welcomeMessage">Welcome back, Admin!</p>
            </div>
            <div class="admin-profile">
                <div class="avatar" id="avatarInitial">A</div>
                <span id="adminName">Admin</span>
            </div>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon"><i class="ri-shopping-bag-line"></i></div>
                <div class="stat-value" id="totalOrders">-</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="ri-money-rupee-circle-line"></i></div>
                <div class="stat-value" id="totalRevenue">-</div>
                <div class="stat-label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="ri-user-line"></i></div>
                <div class="stat-value" id="totalCustomers">-</div>
                <div class="stat-label">Total Customers</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="ri-box-3-line"></i></div>
                <div class="stat-value" id="totalProducts">-</div>
                <div class="stat-label">Total Products</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3>Recent Orders</h3>
                <span style="color:#a0a0a0;font-size:12px;">Last 10 orders</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="recentOrders">
                        <tr>
                            <td colspan="5" style="text-align:center;padding:30px;color:#6b6b6b;">
                                <div class="loading-shimmer" style="width:60%;margin:0 auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="version-info" id="versionInfo">Loading...</div>
    </main>
</div>

<script>
    // ✅ USE YOUR RENDER URL
    const API_URL = 'https://backend-server-4-p7h3.onrender.com/api';
    
    console.log('📊 Dashboard Loading...');
    console.log(`📡 Using API: ${API_URL}`);

    document.getElementById('versionInfo').textContent = `API: ${API_URL}`;

    let refreshInterval = null;

    function getToken() {
        return localStorage.getItem('adminToken');
    }

    function getUser() {
        try {
            return JSON.parse(localStorage.getItem('adminUser') || '{}');
        } catch {
            return {};
        }
    }

    function logout() {
        localStorage.removeItem('adminToken');
        localStorage.removeItem('adminUser');
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
        window.location.href = 'login.html';
    }

    async function apiCall(endpoint, options = {}) {
        const token = getToken();
        const headers = {
            'Content-Type': 'application/json',
            ...(token && { 'Authorization': `Bearer ${token}` }),
            ...options.headers
        };
        
        try {
            const response = await fetch(`${API_URL}${endpoint}`, { 
                ...options, 
                headers,
                signal: AbortSignal.timeout(15000)
            });
            
            const data = await response.json();
            
            if (response.status === 401) {
                logout();
                throw new Error('Session expired. Please login again.');
            }
            
            return data;
        } catch (error) {
            if (error.name === 'AbortError') {
                throw new Error('Request timeout. Please check your connection.');
            }
            throw error;
        }
    }

    function updateUserProfile() {
        const user = getUser();
        const avatarEl = document.getElementById('avatarInitial');
        const nameEl = document.getElementById('adminName');
        const welcomeEl = document.getElementById('welcomeMessage');
        
        if (user.name) {
            avatarEl.textContent = user.name.charAt(0).toUpperCase();
            nameEl.textContent = user.name;
            welcomeEl.textContent = `Welcome back, ${user.name}!`;
        }
    }

    function updateStats(stats) {
        document.getElementById('totalOrders').textContent = stats.totalOrders || 0;
        document.getElementById('totalRevenue').textContent = '₹' + (stats.totalRevenue || 0).toLocaleString();
        document.getElementById('totalCustomers').textContent = stats.totalCustomers || 0;
        document.getElementById('totalProducts').textContent = stats.totalProducts || 0;
    }

    function renderOrders(orders) {
        const tbody = document.getElementById('recentOrders');
        
        if (!orders || orders.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align:center;padding:30px;color:#6b6b6b;">
                        <i class="ri-shopping-bag-line" style="font-size:32px;display:block;margin-bottom:8px;"></i>
                        No orders found
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = orders.slice(0, 10).map(o => {
            const status = o.status || 'pending';
            const statusMap = {
                'paid': 'delivered',
                'created': 'shipped',
                'pending': 'pending',
                'cancelled': 'cancelled'
            };
            const statusClass = statusMap[status] || 'pending';
            
            return `
                <tr>
                    <td><code style="background:#0d0d0d;padding:2px 8px;border-radius:4px;font-size:12px;">${o.orderId ? o.orderId.slice(0, 12) : 'N/A'}</code></td>
                    <td>${o.shippingAddress?.name || 'Guest'}</td>
                    <td><strong>₹${(o.amount || o.total || 0).toLocaleString()}</strong></td>
                    <td><span class="status-badge ${statusClass}">${status}</span></td>
                    <td>${o.createdAt ? new Date(o.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : 'N/A'}</td>
                </tr>
            `;
        }).join('');
    }

    async function loadDashboard() {
        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        try {
            updateUserProfile();
            const data = await apiCall('/analytics/overview');
            if (data.success) {
                const stats = data.overview || {};
                updateStats(stats);
            }

            const ordersData = await apiCall('/orders');
            if (ordersData.success) {
                renderOrders(ordersData.orders);
            }
        } catch (error) {
            console.error('Error loading dashboard:', error);
            const tbody = document.getElementById('recentOrders');
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align:center;padding:30px;color:#ef4444;">
                        <i class="ri-error-warning-line" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                        ${error.message || 'Failed to load data'}
                    </td>
                </tr>
            `;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadDashboard();
        refreshInterval = setInterval(() => {
            if (getToken()) {
                loadDashboard();
            }
        }, 30000);
    });

    window.addEventListener('beforeunload', () => {
        if (refreshInterval) {
            clearInterval(refreshInterval);
            refreshInterval = null;
        }
    });
</script>
</body>
</html>
